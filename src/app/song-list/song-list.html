<h2>Alle Songs</h2>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Song</th>
      <th>Künstler</th>
      <th>Status</th>
      <th>Aktion</th>
    </tr>
  </thead>
  <tbody>
    @for (song of songs; track $index) {
      <tr>
        <td>{{ song.title }}</td>
        <td>{{ song.artist }}</td>
        <td>{{ song.status }}</td>
        <td>
          <a routerLink="/edit" class="btn btn-lila btn-sm me-1">Bearbeiten</a>
          <button class="btn btn-loeschen btn-sm">Löschen</button>
        </td>
      </tr>
    }
    @empty {
      <tr>
        <td colspan="4">Keine Songs vorhanden</td>
      </tr>
    }
  </tbody>
</table>
