  <div class="row">
  <div class="col-12 col-md-10 text-center mx-auto">

<h2 class="titel">Overview</h2>

<table class="table table-striped">
  <thead>
    <tr>
      <th>Song</th>
      <th>Artist</th>
      <th>Status</th>
      <th>Edit</th>
    </tr>
  </thead>
  <tbody>
    @for (song of songs; track $index) {
      <tr>
        <td>{{ song.title }}</td>
        <td>{{ song.artist }}</td>
        <td>{{ song.status }}</td>
        <td>
          <a [routerLink]="['/edit', song._id]" class="btn btn-lila btn-sm me-1">
            <i class="bi bi-pencil"></i>
          </a>
          <button class="btn btn-loeschen btn-sm" (click)="delete(song._id!)">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    }
    @empty {
      <tr>
        <td colspan="4">no songs found</td>
      </tr>
    }
  </tbody>
</table>
<a routerLink="/add" class="btn btn-add-song">+ Add Song</a>
<a routerLink="/setlist" class="btn btn-setlist">✓ Complete</a>
</div>
</div>
