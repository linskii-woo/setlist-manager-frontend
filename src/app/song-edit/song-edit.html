<h2>Song bearbeiten</h2>

<form>
  <div class="mb-3">
    <label>Songname:</label>
    <input type="text" class="form-control" [(ngModel)]="song.title" name = "title">
  </div>
  <div class="mb-3">
    <label>Künstler:</label>
    <input type="text" class="form-control" [(ngModel)]="song.artist" name="artist">
  </div>
  <div class="mb-3">
    <label>Status:</label>
    <select class="form-control" [(ngModel)]="song.status" name="status">
      <option value="Neu">Neu</option>
      <option value="In Arbeit">In Arbeit</option>
      <option value="Bereit">Bereit</option>
    </select>
  </div>
  <button type="button" class="col-2 btn btn-lila" (click)="updateSong()">
    Änderung speichern
  </button>
  <button type="button" class="col-2 ms-2 btn btn-secondary" (click)="cancel()">
    Abbrechen
  </button>
</form>
