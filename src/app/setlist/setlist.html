<h2>My Setlist</h2>
<ol id="setlist" #setlistRef>
    @for (song of setlist; track $index) {
        <li>
            <span class="sortier-griff">≡</span>
            {{ song.title }} - {{ song.artist }}
        </li>
    }
    @if (setlist.length === 0) {
        <p>no songs ready yet</p>
    }
</ol>
